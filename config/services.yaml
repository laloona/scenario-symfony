services:
  _defaults:
    autowire: true
    autoconfigure: true

  Scenario\Symfony\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/**/Tests/'

  Scenario\Symfony\Runtime\ProcessRunnerInterface:
    alias: Scenario\Symfony\Runtime\ProcessRunner

  _instanceof:
    Scenario\Symfony\Command\ScenarioCommand:
      calls:
        - method: setAllowedEnvs
          arguments:
            - '%scenario.allowed_envs%'