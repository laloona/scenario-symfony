services:
  _defaults:
    autowire: true
    autoconfigure: true

  Stateforge\Scenario\Core\PHPUnit\Configuration\ConfigFinder: ~
  Stateforge\Scenario\Core\PHPUnit\Configuration\Configured: ~

  Stateforge\Scenario\Core\PHPUnit\Configuration\ConfiguredInterface:
    alias: Stateforge\Scenario\Core\PHPUnit\Configuration\Configured

  Stateforge\Scenario\Symfony\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/**/Tests/'

  Stateforge\Scenario\Core\Contract\DatabaseRefreshExecutorInterface:
    alias: Stateforge\Scenario\Symfony\Runtime\DatabaseRefreshExecutor
    public: true

  Stateforge\Scenario\Symfony\Runtime\CommandRunnerInterface:
    alias: Stateforge\Scenario\Symfony\Runtime\CommandRunner

  Stateforge\Scenario\Symfony\Runtime\ConfigResolverInterface:
    alias: Stateforge\Scenario\Symfony\Runtime\ConfigResolver

  Stateforge\Scenario\Symfony\Runtime\MessageConsumerInterface:
    alias: Stateforge\Scenario\Symfony\Runtime\MessageConsumer

  Stateforge\Scenario\Symfony\Runtime\ProcessRunnerInterface:
    alias: Stateforge\Scenario\Symfony\Runtime\ProcessRunner

  Stateforge\Scenario\Symfony\Runtime\Metadata\ProcessFactoryInterface:
    alias: Stateforge\Scenario\Symfony\Metadata\ProcessFactory

  _instanceof:
    Stateforge\Scenario\Symfony\Command\ScenarioCommand:
      calls:
        - method: setAllowedEnvs
          arguments:
            - '%scenario.allowed_envs%'