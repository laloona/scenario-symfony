services:
  _defaults:
    autowire: true
    autoconfigure: true

  Scenario\Core\PHPUnit\Configuration\ConfigFinder: ~
  Scenario\Core\PHPUnit\Configuration\Configured: ~

  Scenario\Core\PHPUnit\Configuration\ConfiguredInterface:
    alias: Scenario\Core\PHPUnit\Configuration\Configured

  Scenario\Symfony\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/**/Tests/'

  Scenario\Core\Contract\DatabaseRefreshExecutorInterface:
    alias: Scenario\Symfony\Runtime\DatabaseRefreshExecutor

  Scenario\Symfony\Runtime\CommandRunnerInterface:
    alias: Scenario\Symfony\Runtime\CommandRunner

  Scenario\Symfony\Runtime\ConfigResolverInterface:
    alias: Scenario\Symfony\Runtime\ConfigResolver

  Scenario\Symfony\Runtime\MessageConsumerInterface:
    alias: Scenario\Symfony\Runtime\MessageConsumer

  Scenario\Symfony\Runtime\ProcessRunnerInterface:
    alias: Scenario\Symfony\Runtime\ProcessRunner

  Scenario\Symfony\Runtime\Metadata\ProcessFactoryInterface:
    alias: Scenario\Symfony\Metadata\ProcessFactory

  _instanceof:
    Scenario\Symfony\Command\ScenarioCommand:
      calls:
        - method: setAllowedEnvs
          arguments:
            - '%scenario.allowed_envs%'